# Cloudflare Workers 配置，线上已由deploy.yml接管，这里仅供本地测试
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "f428af53-eada-43ac-9be1-8f1fe82f6ace"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 非敏感变量可以放在这里；API_SECRET 属于敏感凭据（探针上报/管理员回退密码），
# 一律放在 .dev.vars（本地，已被 gitignore）或通过 `wrangler secret put API_SECRET`（线上）配置，
# 不要写进 wrangler.toml，避免随仓库泄漏
[vars]
API_USER_NAME = "admin"

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
