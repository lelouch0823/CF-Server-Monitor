name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      - name: 📝 Create wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          API_USER_NAME: ${{ secrets.API_USER_NAME }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          node -e '
            const fs = require("node:fs");
            const toTomlString = (value) => JSON.stringify(String(value ?? ""));
            const apiUserName = String(process.env.API_USER_NAME ?? "").trim();
            const corsAllowedOrigins = String(process.env.CORS_ALLOWED_ORIGINS ?? "").trim();
            const varLines = [];
            if (apiUserName) {
              varLines.push(`API_USER_NAME = ${toTomlString(apiUserName)}`);
            }
            if (corsAllowedOrigins) {
              varLines.push(`CORS_ALLOWED_ORIGINS = ${toTomlString(corsAllowedOrigins)}`);
            }
            const content = [
              "name = \"server-monitor-pro\"",
              "main = \"src/index.js\"",
              "compatibility_date = \"2024-12-01\"",
              "compatibility_flags = [\"nodejs_compat\"]",
              "",
              "keep_vars = true",
              "",
              "# 定时任务配置（UTC）",
              "# - 每分钟：执行离线节点检测",
              "# - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）",
              "[triggers]",
              "crons = [\"*/1 * * * *\", \"0 * * * *\"]",
              "",
              "[assets]",
              "directory = \"./dist\"",
              "binding = \"ASSETS\"",
              "",
              "[[d1_databases]]",
              "binding = \"DB\"",
              "database_name = \"server-monitor-db\"",
              `database_id = ${toTomlString(process.env.D1_DATABASE_ID)}`,
              "",
              "# Durable Objects：实时指标广播中心",
              "[[durable_objects.bindings]]",
              "name = \"METRICS_BROADCASTER\"",
              "class_name = \"MetricsBroadcaster\"",
              "",
              "[[migrations]]",
              "tag = \"v1\"",
              "new_sqlite_classes = [\"MetricsBroadcaster\"]",
              "",
              "# API_SECRET 不写入 [vars]（明文可读），部署后统一通过 wrangler secret put 配置",
              "[vars]",
              ...varLines,
              ""
            ].join("\n");
            fs.writeFileSync("wrangler.toml", content, { encoding: "utf8", mode: 0o600 });
          '
          echo "✅ wrangler.toml 已安全生成"

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      # 前提：MetricsBroadcaster 类必须从 index.js 导出（已通过 src/index.js 实现）。
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      # API_SECRET 以加密 Worker Secret 存储（不上 Dashboard 明文 vars），
      # 通过 stdin 传递避免进入 shell 历史与进程参数；未配置时跳过避免清空线上密钥
      - name: 🔑 Sync API_SECRET as Worker secret
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$API_SECRET" ]; then
            printf '%s' "$API_SECRET" | npx wrangler@4 secret put API_SECRET
          else
            echo "ℹ️ 未配置 API_SECRET，跳过同步以避免覆盖线上密钥为空"
          fi

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
